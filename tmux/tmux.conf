# theme:
source-file ~/.config/tmux/flexoki.tmuxtheme
unbind C-b
set-option -g prefix C-x
# set-option -sg escape-time 1
bind-key C-a send-prefix
bind C-u split-window -h
bind C-v split-window -v
unbind '"'
unbind %
# binding reload:
bind r source-file ~/.config/tmux/tmux.conf
# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
# switch panes using Alt-arrow without prefix
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D
# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

#non-bind
# bind -r C-k select-pane -U
# bind -r C-j select-pane -D
# bind -r C-h select-pane -L
# bind -r C-l select-pane -R
#pane border
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'
# Fix Colors
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g status-position bottom
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour1'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10
setw -g window-status-current-style 'fg=colour0 bg=colour1 bold'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=colour1 dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour1]#F '
setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'
# messages
set -g message-style 'fg=colour2 bg=colour0 bold'
# Bind Ctrl+Shift+h to resize pane left
# bind-key -n M-H resize-pane -L
#
# # Bind Ctrl+Shift+l to resize pane right
# bind-key -n M-L resize-pane -R


# resize
bind-key -n M-H resize-pane -L 8
bind-key -n M-K resize-pane -U 4

# Bind Ctrl+Shift+l to resize pane right by 5 cells
bind-key -n M-L resize-pane -R 8
bind-key -n M-J resize-pane -D 4
