# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=eDP-1,1920x1080@60,0x0,1.0
# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = waybar & hyprpaper 
exec-once = copyq --start-server

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
# $audioUp = pulseaudio-ctl up
$audioUp = pamixer -ui 3 && pamixer --get-volume
$audioDown = pamixer -ud 5 && pamixer --get-volume
$audioMute = pamixer -t && pamixer --get-mute
$terminal = alacritty
$discord = discord
$browser = brave
$firefox = firefox
$fileManager = thunar
$menu = rofi -show run
$menuDrun = rofi -show drun
$brightnessUp = brightnessctl s 30+
$brightnessDown = brightnessctl s 30-
# Some default env vars.
env = XCURSOR_SIZE,64
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
	natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 4
    border_size = 3
    col.active_border =  rgba(16f200FF) 
    col.inactive_border = rgba(FF7D7D16)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 20

    active_opacity = 0.99
    inactive_opacity = 0.9
    blur {
	enabled = true
	size = 3
	passes = 3
	
	vibrancy = 0.4696
    }

    # drop_shadow = false
    # shadow_range = 14
    # shadow_render_power = 13
    # col.shadow = rgba(1a1a1aee)
}

animations {
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 7, default
    
    enabled=1
    bezier=overshot,0.05,0.9,0.1,1.1
    bezier=overshot,0.13,0.99,0.29,1.1
    animation = windowsMove, 1, 5, myBezier
    animation = windowsOut, 1, 5, myBezier 
    animation = fade, 1, 5, default
    animation=workspaces,1,4,overshot,slidevert
}

dwindle {
    pseudotile=1
    force_split=2
}

master{
    
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe=yes
    workspace_swipe_fingers=3
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device:epic-mouse-v1 {
#     sensitivity = -0.5
# }
 device{
name=2.4g-mouse
accel_profile=flat
}
 device{
name=logitech-g102-lightsync-gaming-mouse
accel_profile=flat
}

# Example windowrule v1
# windowrule = float,rofi
# Example windowrule v2
windowrulev2 = float,class:^(Rofi)$,title:^(rofi - Bluetooth)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# windowrulev2 = nomaximizerequest, class:.* # You'll probably like this.


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = ,122, exec, $audioDown,
bind = ,123, exec, $audioUp,
bind = $mainMod SHIFT,O, exec, $audioDown,
bind = $mainMod ,O, exec, $audioUp,
bind = ,233, exec, $brightnessUp
bind = ,232, exec, $brightnessDown
bind = $mainMod, D, exec, [workspace 4, silent;] $discord
bind = $mainMod, 36, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod SHIFT, 22, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, [workspace 1 silent;] $browser
bind = $mainMod SHIFT, B, exec, [workspace 1 silent;] $firefox
bind = $mainMod SHIFT, 65, togglefloating,
bind = $mainMod, M, exec, [floating;] $menu
bind = $mainMod SHIFT, M, exec, [floating;] $menuDrun
bind = $mainMod, P, pin, # dwindle
bind = $mainMod, I, togglesplit, # dwindle
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, F, fullscreen,
# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod SHIFT, h , movewindow, l
bind = $mainMod SHIFT, j , movewindow, d
bind = $mainMod SHIFT, k , movewindow, u
bind = $mainMod SHIFT, l , movewindow, r
bind = $mainMod CTRL, j , resizeactive, 0 -40 
bind = $mainMod CTRL, h , resizeactive, -80 0 
bind = $mainMod CTRL, k , resizeactive, 0 40 
bind = $mainMod CTRL, l , resizeactive, 80 0 


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
