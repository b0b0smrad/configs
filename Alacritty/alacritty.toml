
import = [
  "~/.config/alacritty/themes/alacritty-theme/themes/dracula.toml"
]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.90
dynamic_title = true

  [window.dimensions]
  columns = 175
  lines = 40

  [window.padding]
  x = 2
  y = 0

[scrolling]
history = 5_000
multiplier = 8

[font]
size = 23

  [font.normal]
  family = "UbuntuMono NF"
  style = "Medium"

  [font.bold]
  family = "UbuntuMono NF"
  style = "Bold"

  [font.italic]
  family = "JetBrainsMonoNL Nerd Font"
  style = "italic"

[colors]

# ["default paste binding"]
# key = "V"
# mods = "Control|Shift"
# action = "Paste"
